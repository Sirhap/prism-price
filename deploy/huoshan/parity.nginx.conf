server {
    listen 80;
    listen [::]:80;
    server_name parity.sirhao.top;
    location / { return 301 https://parity.sirhao.top$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name parity.sirhao.top;
    ssl_certificate /www/sites/parity/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/parity/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    add_header X-LDXP-Origin huoshan always;

    location /__server/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
